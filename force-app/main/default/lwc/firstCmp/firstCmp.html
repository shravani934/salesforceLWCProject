<template>
    <lightning-card title="Students Info parent">
        <template for:each={students} for:item="student">
            <c-second-cmp
                key={student.rollNumber}
                student={student}
                onselectstudent={handleStudentSelect}>
            </c-second-cmp>
        </template>

        <template if:true={selectedStudent}>
            <div style="padding-top: 10px;">
                <p><strong>you've selected:</strong></p>
                <p>Name: {selectedStudent.name}</p>
                <p>Age: {selectedStudent.age}</p>
                <p>RollNumber: {selectedStudent.rollNumber}</p>
            </div>
        </template>
    </lightning-card>
</template>
